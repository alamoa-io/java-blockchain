<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<h1>step1 初期ブロック作成</h1>
<h2>init block: <span th:text="${first}">first block</span></h2>

<h1>step2 トランザクション追加(transaction pool内部)</h1>
<h2>transaction pool:<span th:text="${transactionPoolBefore}">add transaction</span></h2>

<h1>step3 ブロック追加(ブロック追加後)</h1>
<h2>transaction pool after: <span th:text="${transactionPoolAfter}">after add block</span></h2>
<h2>after add block: <span th:text="${addedBlock}">json</span></h2>

<h1>ハッシュ計算</h1>
<h2>nonce:<span th:text="${nonce}">nonce</span></h2>
<h2>nonce:<span th:text="${reproducedHash}">hash</span></h2>

<h1>各アドレスの値</h1>
<h2>A address: <span th:text="${AddressA}">A</span></h2>
<h2>B address: <span th:text="${AddressB}">B</span></h2>
<h2>C address: <span th:text="${AddressC}">C</span></h2>
<h2>D address: <span th:text="${AddressD}">D</span></h2>

</body>
</html>
